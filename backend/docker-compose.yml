name: stonecrest

services:
  db:
    image: postgres:16-alpine
    container_name: stonecrest-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stonecrest}
      POSTGRES_USER: ${POSTGRES_USER:-stonecrest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stonecrest}
    volumes:
      - stonecrest_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-stonecrest} -d ${POSTGRES_DB:-stonecrest}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stonecrest-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    image: stonecrest-backend
    container_name: stonecrest-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - stonecrest_media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    image: stonecrest-backend
    container_name: stonecrest-celery-worker
    command: celery -A config worker -l info
    env_file:
      - .env
    volumes:
      - stonecrest_media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  celery_beat:
    image: stonecrest-backend
    container_name: stonecrest-celery-beat
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  stonecrest_postgres_data:
  stonecrest_media_data:
