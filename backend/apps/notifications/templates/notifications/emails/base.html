<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{% block title %}Stonecrest{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#f7f5f1;color:#1c1a17;-webkit-text-size-adjust:100%;">
    <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
      {% block preheader %}{% endblock %}
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f7f5f1;">
      <tr>
        <td align="center" style="padding:48px 20px;">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;background:#fbfaf7;border:1px solid #e4e0d8;">
            <tr>
              <td style="padding:36px 40px 28px;border-bottom:1px solid #e4e0d8;">
                <p style="margin:0;font-family:Arial, Helvetica, sans-serif;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:#1c1a17;">
                  Stonecrest
                </p>
                <p style="margin:10px 0 0;font-family:Arial, Helvetica, sans-serif;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8a847a;">
                  Dubai Real Estate
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:40px 40px 16px;">
                {% block eyebrow %}{% endblock %}
                {% block headline %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:0 40px 40px;font-family:Georgia, 'Times New Roman', serif;font-size:16px;line-height:1.7;color:#2c2924;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:28px 40px;border-top:1px solid #e4e0d8;background:#f3f0ea;">
                <p style="margin:0;font-family:Arial, Helvetica, sans-serif;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8a847a;">
                  Stonecrest · Dubai, United Arab Emirates
                </p>
                <p style="margin:10px 0 0;font-family:Arial, Helvetica, sans-serif;font-size:12px;line-height:1.5;color:#8a847a;">
                  <a href="mailto:hello@stonecrestdxb.com" style="color:#8a847a;text-decoration:none;">hello@stonecrestdxb.com</a>
                  &nbsp;·&nbsp;© {{ year }}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
